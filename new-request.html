<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая заявка | Корочки.есть</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="image05.jpg" alt="Логотип">
            <span class="logo-text">Корочки.есть</span>
        </div>
        <a href="index.html" class="back-link" style="margin:0;">К заявкам</a>
    </header>
    <main class="container">
        <div class="form-card">
            <h2>Подать новую заявку</h2>
            <div class="form-group">
                <label>Курс</label>
                <select id="course-select">
                    <option value="Основы алгоритмизации и программирования">Основы алгоритмизации и программирования</option>
                    <option value="Основы веб-дизайна">Основы веб-дизайна</option>
                </select>
            </div>
            <div class="form-group">
                <label>Дата начала</label>
                <input type="text" id="start-date" value="02.11.2026">
            </div>
            <div class="form-group" style="margin-bottom:25px;">
                <label>Оплата</label>
                <select id="payment-select">
                    <option value="Переводом по номеру телефона">Переводом по номеру телефона</option>
                    <option value="Наличными">Наличными</option>
                </select>
            </div>
            <button type="button" class="btn-blue" id="submit-req-btn">Отправить заявку</button>
        </div>
</body>
</html>
